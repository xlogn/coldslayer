[package]
name = "coldslayer"
version = "0.2.1"
edition = "2021"
authors = ["Karan (xlogn) <karnk2708@gmail.com>"]
description = "AI-Native Cold File Archiver (csl) with Seekable Zstandard Packs & Embedded Tantivy BM25/Fuzzy Search"
license = "AGPL-3.0-only"
repository = "https://github.com/xlogn/coldslayer"
homepage = "https://github.com/xlogn/coldslayer"

[[bin]]
name = "csl"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
filetime = "0.2"
hex = "0.4"
rayon = "1.10"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
tantivy = "0.22"
walkdir = "2.5"
zstd = "0.13"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
